<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoCapacita - Diagnóstico de Maturidade</title>
    
    <!-- Fonte Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Configuração Tailwind (Paleta Sustentável: Verde Esmeralda e Azul Marinho) -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            emerald: '#059669', // Verde Esmeralda
                            navy: '#0F2C59',    // Azul Marinho
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        /* Animações CSS Customizadas */
        @keyframes fade-in-up {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes scale-in {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }
        .animate-fade-in {
            animation: fade-in-up 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .animate-scale-in {
            animation: scale-in 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        /* Estilização dos Checkboxes Mobile-First */
        .check-card {
            transition: all 0.2s ease-in-out;
        }
        input[type="checkbox"]:checked + .check-card {
            background-color: #ecfdf5; /* emerald-50 */
            border-color: #059669;     /* emerald-600 */
        }
        input[type="checkbox"]:checked + .check-card .check-icon {
            color: #059669;
            opacity: 1;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-brand-navy via-slate-800 to-brand-emerald min-h-screen flex items-center justify-center p-4 antialiased">

    <!-- Container Principal (Glassmorphism) -->
    <main class="w-full max-w-md bg-white/90 backdrop-blur-xl rounded-3xl shadow-2xl border border-white/40 overflow-hidden animate-fade-in">
        
        <!-- Cabeçalho -->
        <header class="bg-white/50 border-b border-gray-200/50 p-6 text-center">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-brand-emerald/10 text-brand-emerald mb-3">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-brand-navy tracking-tight">EcoCapacita</h1>
            <p class="text-sm text-slate-500 mt-1">Diagnóstico de Maturidade em Campo</p>
        </header>

        <!-- Área de Conteúdo -->
        <div class="p-6">
            
            <!-- Formulário de Avaliação -->
            <form id="checklist-form" onsubmit="calcularMaturidade(event)">
                
                <div class="mb-6">
                    <label for="coop-name" class="block text-sm font-medium text-slate-700 mb-2">Nome da Cooperativa</label>
                    <input type="text" id="coop-name" required placeholder="Ex: Cooperativa Recicla Mais" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-emerald focus:border-brand-emerald outline-none transition-shadow bg-white/50">
                </div>

                <p class="text-sm font-semibold text-slate-800 mb-3">Infraestrutura e Gestão Presentes:</p>
                
                <div class="space-y-3 mb-8">
                    <!-- Item 1: Prensas -->
                    <label class="relative flex cursor-pointer">
                        <input type="checkbox" id="prensa" class="peer sr-only">
                        <div class="check-card w-full flex items-center justify-between p-4 rounded-xl border border-slate-200 bg-white hover:bg-slate-50">
                            <div class="flex flex-col">
                                <span class="font-medium text-slate-800">Prensas Operantes</span>
                                <span class="text-xs text-slate-500">Equipamento para compactação</span>
                            </div>
                            <svg class="check-icon h-6 w-6 opacity-20 text-slate-400 transition-opacity" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                        </div>
                    </label>

                    <!-- Item 2: Balanças -->
                    <label class="relative flex cursor-pointer">
                        <input type="checkbox" id="balanca" class="peer sr-only">
                        <div class="check-card w-full flex items-center justify-between p-4 rounded-xl border border-slate-200 bg-white hover:bg-slate-50">
                            <div class="flex flex-col">
                                <span class="font-medium text-slate-800">Balanças Calibradas</span>
                                <span class="text-xs text-slate-500">Medição precisa de massa</span>
                            </div>
                            <svg class="check-icon h-6 w-6 opacity-20 text-slate-400 transition-opacity" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                        </div>
                    </label>

                    <!-- Item 3: EPIs -->
                    <label class="relative flex cursor-pointer">
                        <input type="checkbox" id="epi" class="peer sr-only">
                        <div class="check-card w-full flex items-center justify-between p-4 rounded-xl border border-slate-200 bg-white hover:bg-slate-50">
                            <div class="flex flex-col">
                                <span class="font-medium text-slate-800">Uso de EPIs</span>
                                <span class="text-xs text-slate-500">Segurança dos cooperados</span>
                            </div>
                            <svg class="check-icon h-6 w-6 opacity-20 text-slate-400 transition-opacity" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                        </div>
                    </label>

                    <!-- Item 4: NF-e -->
                    <label class="relative flex cursor-pointer">
                        <input type="checkbox" id="nfe" class="peer sr-only">
                        <div class="check-card w-full flex items-center justify-between p-4 rounded-xl border border-slate-200 bg-white hover:bg-slate-50">
                            <div class="flex flex-col">
                                <span class="font-medium text-slate-800">Emissão de NF-e</span>
                                <span class="text-xs text-slate-500">Rastreabilidade fiscal ativa</span>
                            </div>
                            <svg class="check-icon h-6 w-6 opacity-20 text-slate-400 transition-opacity" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                        </div>
                    </label>
                </div>

                <button type="submit" class="w-full bg-brand-navy hover:bg-slate-800 text-white font-semibold py-4 rounded-xl shadow-lg transition-transform transform hover:-translate-y-0.5 focus:outline-none focus:ring-4 focus:ring-slate-300 flex justify-center items-center gap-2">
                    Calcular Score
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                    </svg>
                </button>
            </form>

            <!-- Área de Resultado (Oculta inicialmente) -->
            <div id="result-section" class="hidden text-center animate-scale-in py-4">
                <p class="text-sm text-slate-500 mb-1">Resultado da Avaliação</p>
                <h2 id="result-coop-name" class="text-xl font-bold text-slate-800 mb-6">Nome da Coop</h2>
                
                <div class="inline-flex flex-col items-center justify-center p-6 rounded-full w-40 h-40 border-4 mb-4 shadow-inner bg-slate-50" id="score-circle">
                    <span class="text-sm font-medium text-slate-500 uppercase tracking-widest">Nível</span>
                    <span id="score-level" class="text-6xl font-extrabold mt-[-4px]">A</span>
                </div>
                
                <p id="score-message" class="text-slate-600 text-sm mb-8 px-2 font-medium leading-relaxed"></p>
                
                <button type="button" onclick="reiniciarAvaliacao()" class="w-full bg-white border-2 border-slate-200 text-slate-700 hover:bg-slate-50 font-semibold py-3 rounded-xl transition-colors focus:outline-none focus:ring-4 focus:ring-slate-100">
                    Nova Avaliação
                </button>
            </div>

        </div>
    </main>

    <script>
        function calcularMaturidade(event) {
            // Previne o recarregamento da página (comportamento padrão do form)
            event.preventDefault();

            // Coleta os dados dos inputs
            const nomeCoop = document.getElementById('coop-name').value;
            const hasPrensa = document.getElementById('prensa').checked;
            const hasBalanca = document.getElementById('balanca').checked;
            const hasEpi = document.getElementById('epi').checked;
            const hasNfe = document.getElementById('nfe').checked;

            // Lógica de Pontuação (Score)
            let score = 0;
            if (hasPrensa) score++;
            if (hasBalanca) score++;
            if (hasEpi) score++;
            if (hasNfe) score++;

            // Elementos de UI do resultado
            const resultSection = document.getElementById('result-section');
            const formSection = document.getElementById('checklist-form');
            const resultCoopName = document.getElementById('result-coop-name');
            const scoreLevel = document.getElementById('score-level');
            const scoreMessage = document.getElementById('score-message');
            const scoreCircle = document.getElementById('score-circle');

            // Define o Nível, Cores e Mensagens baseado no Score
            let nivel = '';
            let corBorda = '';
            let corTexto = '';
            let mensagem = '';

            if (score === 4) {
                nivel = 'A';
                corBorda = 'border-brand-emerald';
                corTexto = 'text-brand-emerald';
                mensagem = 'Excelente! Cooperativa estruturada, formalizada e pronta para gerar créditos com rastreabilidade total.';
            } else if (score >= 2) {
                nivel = 'B';
                corBorda = 'border-amber-400';
                corTexto = 'text-amber-500';
                mensagem = 'Operacional, mas requer ações estruturantes. Necessita de investimentos em equipamentos ou formalização.';
            } else {
                nivel = 'C';
                corBorda = 'border-red-400';
                corTexto = 'text-red-500';
                mensagem = 'Estágio inicial de maturidade. Requer intervenção imediata da Entidade Gestora para adequação física e legal.';
            }

            // Atualiza a UI
            resultCoopName.textContent = nomeCoop;
            scoreLevel.textContent = nivel;
            scoreLevel.className = `text-6xl font-extrabold mt-[-4px] ${corTexto}`;
            scoreCircle.className = `inline-flex flex-col items-center justify-center p-6 rounded-full w-40 h-40 border-4 mb-4 shadow-inner bg-slate-50 ${corBorda}`;
            scoreMessage.textContent = mensagem;

            // Transição Form -> Resultado
            formSection.classList.add('hidden');
            resultSection.classList.remove('hidden');
        }

        function reiniciarAvaliacao() {
            // Reseta o formulário
            document.getElementById('checklist-form').reset();
            
            // Transição Resultado -> Form
            document.getElementById('result-section').classList.add('hidden');
            document.getElementById('checklist-form').classList.remove('hidden');
        }
    </script>
</body>
</html>
